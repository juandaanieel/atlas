<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Atlas Explorer</title>
    <script>
      (function () {
        document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
    <link rel="stylesheet" href="assets/styles.css?v=__ATLAS_STYLES_VERSION__">
  </head>
  <body>
    <script>
      window.ATLAS_PAYLOAD = __ATLAS_PAYLOAD__;
    </script>
    <div class="shell">
      <aside class="sidebar">
        <div id="head" class="head"></div>
        <nav id="sidebarTabs" class="sidebar-tabs" aria-label="Sidebar sections"></nav>
        <nav id="views" class="views" aria-label="Pages"></nav>
        <div id="tree" class="tree" hidden></div>
        <section id="reviewPromptPanel" class="review-prompt-panel" aria-label="Review prompt" hidden></section>
      </aside>
      <main class="stage">
        <div class="toolbar">
          <nav id="history" class="history" aria-label="Navigation"></nav>
          <div id="crumbs" class="crumbs"></div>
          <div id="tools" class="tools"></div>
        </div>
        <section id="graphPromptComposer" class="graph-prompt-composer" aria-label="Graph prompt composer" hidden></section>
        <section id="traceDock" class="trace-dock" aria-label="Static call trace" hidden></section>
        <svg id="canvas" class="canvas" role="group" aria-label="Interactive scoped code graph" aria-describedby="hint"></svg>
        <section id="tabContent" class="tab-content" hidden></section>
        <div class="hint" id="hint"></div>
      </main>
      <div id="detailResize" class="detail-resize" role="separator" aria-label="Resize code panel" aria-orientation="vertical" tabindex="0" hidden></div>
      <aside id="detail" class="detail-panel" aria-label="Code details" tabindex="-1" hidden></aside>
    </div>
    <script src="assets/src/core.js?v=__ATLAS_CORE_VERSION__"></script>
    <script src="assets/src/app.js?v=__ATLAS_APP_VERSION__"></script>
  </body>
</html>
