[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.2.0"
description = "A local, file-first Python package explorer."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Atlas" }]
dependencies = []
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4.18,<5",
    "pytest>=8,<9",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
atlas = ["dashboard/static/*", "explorer/static/*"]

[tool.setuptools.data-files]
"share/atlas/schema" = ["schema/atlas.schema.json", "schema/atlas-story.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11"
pytest = ">=8.0"
jsonschema = ">=4.18,<5"

[tool.pixi.pypi-dependencies]
atlas = { path = ".", editable = true }

[tool.pixi.tasks]
test = "python -B -m pytest"
explore = "python -B -m atlas explore --where ."
dashboard = "python -B -m atlas dashboard"
smoke = "python -B -m atlas explore --where tests/fixtures/simple_package"
